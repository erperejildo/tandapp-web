<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Tandapp</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f0e7;
      color: #1f2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container {
      display: grid;
      gap: 1rem;
      justify-items: center;
    }
    h1 {
      font-size: 5rem;
      font-weight: 700;
      color: #0f6a62;
      line-height: 1;
    }
    p {
      max-width: 40ch;
      color: #5a6d6c;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: #0f6a62;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(11, 28, 26, 0.14);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>The page you are looking for does not exist. Use the link below to return home.</p>
    <a href="/en">Return home</a>
  </div>
</body>
</html>
